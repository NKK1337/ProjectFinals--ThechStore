<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Step Tech</title>
    <link rel="stylesheet" href="../Reset/reset.css">
    <link rel="stylesheet" href="../Scss/itempage/item.css">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html" class="site-name flex">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <span>STEP TECH</span>
            </a>
            <div class="nav-list" id="navList">
                <ul>
                    <li id="navHoverHome"><a href="../index.html">Home</a></li>
                    <li id="navHoverShop"><a href="./shop.html">Shop</a></li>
                    <li class="has-dropdown">
                        <span class="dropdown-toggle">
                            Categories
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                        <ul class="dropdown-menu" id="categoriesDropdown">
                            <li class="dropdown-loading">Loading...</li>
                        </ul>
                    </li>
                </ul>
            </div>
            <div class="serch-bar">
                <input type="text" placeholder="Search products..." id="searchInputHeader">
                <svg id="clearBtn" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            <div class="auth-header-container" id="authContainer">
                <a class="sign-in-a" href="./signin.html">
                    <button class="sign-in-btn-element">Sign In</button>
                </a>
            </div>
            <div class="menu-overlay" id="menuOverlay"></div>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
                <svg class="icon-open" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <div class="itm-state" id="itmState">Loading product...</div>

        <div class="itm-wrapper" id="itmWrapper" hidden>
            <div class="itm-img">
                <div class="itm-main-img">
                    <img id="itmMainImg" src="" alt="">
                </div>
                <div class="itm-thumbs" id="itmThumbs"></div>
            </div>

            <div class="itm-desc">
                <div class="itm-model">
                    <span class="itm-category" id="itmCategory"></span>
                    <span class="itm-dot">&#9679;</span>
                    <span class="itm-brand" id="itmBrand"></span>
                </div>
                <h1 class="itm-title" id="itmTitle"></h1>

                <div class="itm-starts-rate">
                    <span class="itm-stars" aria-hidden="true">
                        <span class="itm-stars-bg">★★★★★</span>
                        <span class="itm-stars-fill" id="itmStarsFill">★★★★★</span>
                    </span>
                    <span class="itm-rating-num" id="itmRatingNum"></span>
                    <span class="itm-reviews" id="itmReviews"></span>
                </div>

                <div class="itm-price" id="itmPrice"></div>
                <div class="itm-stock" id="itmStock"></div>
                <p class="itm-text" id="itmText"></p>

                <div class="itm-divider"></div>

                <label class="itm-qty-label" for="itmQtyInput">Quantity</label>
                <div class="itm-qty">
                    <button type="button" class="itm-qty-btn" id="qtyMinus" aria-label="Decrease quantity">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <input type="text" class="itm-qty-input" id="itmQtyInput" value="1" inputmode="numeric">
                    <button type="button" class="itm-qty-btn" id="qtyPlus" aria-label="Increase quantity">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <div class="itm-actions">
                    <div class="itm-add-to-cart-btn">
                        <button type="button" class="itm-cart-btn" id="addToCartBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span id="addToCartText">Add to Cart</span>
                        </button>
                    </div>
                    <button type="button" class="itm-fav-btn" id="favBtn" aria-label="Add to favorites"
                        aria-pressed="false">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="itm-toast" id="itmToast" role="status" aria-live="polite"></div>

    <script src="../JavaScript/cart.js"></script>
    <script src="../JavaScript/favorites.js"></script>
    <script src="../JavaScript/burgermenu.js"></script>
    <script src="../JavaScript/items.js"></script>
</body>

</html>
