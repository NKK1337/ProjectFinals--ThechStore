<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Step Tech</title>
    <link rel="stylesheet" href="../Reset/reset.css">
    <link rel="stylesheet" href="../Scss/singinpage/signin.css">
</head>

<body>
    <main>
        <section class="banner-side">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
            </div>
            <p class="banner-title">STEP TECH</p>
            <p class="banner-desc">Access exclusive deals and manage your orders with your account.</p>
            <div class="stats-row">
                <div class="stat-item">
                    <p class="stat-number">50K+</p>
                    <p class="stat-label">Products</p>
                </div>
                <div class="stat-item">
                    <p class="stat-number">200+</p>
                    <p class="stat-label">Brands</p>
                </div>
                <div class="stat-item">
                    <p class="stat-number">24/7</p>
                    <p class="stat-label">Support</p>
                </div>
            </div>
        </section>
        <section class="form-side">
            <div class="form-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </div>
            <p class="form-title">Welcome Back</p>
            <p class="form-subtitle">
                Sign in to continue shopping
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </p>
            <form class="signin-form" novalidate>
                <div class="input-group full">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 6-10 7L2 6"></path>
                        </svg>
                    </span>
                    <input type="email" name="email" placeholder="Email address" required>
                </div>
                <div class="input-group full">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn-signin">Sign In</button>
                <div class="divider"><span>or</span></div>
                <p class="signup-text">Don't have an account? <a href="./reg.html" class="signup-link">Create one now</a></p>
            </form>
        </section>
    </main>
</body>

</html>
